name: Flutter M1

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: flutter-m1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Toolchain
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Generated sources are current
        run: |
          dart run swagger_parser -f swagger_parser.yaml
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib/core/api/generated lib/core/localization/generated
          git diff --exit-code -- contracts/w4 lib/core/api/generated lib/core/localization/generated
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Unit, widget, contract-fixture, and golden tests
        run: flutter test --coverage
      - name: Repository security boundary
        run: dart run tool/security_scan.dart
      - name: Android development build
        run: flutter build apk --flavor development --debug --dart-define-from-file=config/development.json
      - name: Android staging build
        run: flutter build apk --flavor staging --debug --dart-define-from-file=config/staging.json
      - name: Android production compile build
        run: flutter build apk --flavor production --debug --dart-define-from-file=config/production.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-evidence
          path: |
            coverage/lcov.info
            test/golden/goldens/*.png
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 14

  integration-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test --flavor development --dart-define-from-file=config/development.json
