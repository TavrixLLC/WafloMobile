name: Flutter M3C Production-v1 Convergence

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**']
  workflow_dispatch:

concurrency:
  group: flutter-m3c-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.3

jobs:
  linux-quality:
    name: Linux / M1-M3C quality, security, archive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Toolchain
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Contract checksums and generation drift
        run: |
          dart run tool/verify_m2_contracts.dart
          dart run tool/verify_production_v1_contract.dart
          dart run tool/generate_w4_client.dart --check
          flutter gen-l10n
          git diff --exit-code -- contracts/w4 lib/core/api/generated lib/core/api/generated_m2 lib/core/localization/generated
      - name: Portable absolute-path scan
        run: dart run tool/absolute_path_scan.dart
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - name: Analyze fatal
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: M1-M3C unit tests
        run: flutter test test/unit --coverage --reporter expanded
      - name: M1-M3C widget tests
        run: flutter test test/widget --reporter expanded
      - name: M1-M3C golden and screenshot tests
        run: flutter test test/golden --reporter expanded
      - name: Security scan
        run: dart run tool/security_scan.dart
      - name: Portable archive scan
        run: |
          dart run tool/archive_scan.dart artifacts/handoff-m1-round-1/waflo-mobile-m1-round-1-portable-source.zip
          dart run tool/archive_scan.dart artifacts/handoff-m2/waflo-mobile-m2-portable-source.zip
          dart run tool/archive_scan.dart artifacts/handoff-m2-final-reconciliation/waflo-mobile-m2-final-reconciliation-portable-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-m2-evidence
          path: |
            coverage/lcov.info
            test/golden/goldens/*.png
            test/golden/goldens/m2/*.png
            artifacts/handoff-m3a/screenshots/*.png
            artifacts/handoff-m3b/screenshots/*.png
            artifacts/handoff-m3c/screenshots/*.png
            test/golden/failures/*_testImage.png
          if-no-files-found: warn
          retention-days: 14

  android-emulator:
    name: Android emulator / M1-M3C Staff flow matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            flutter test integration_test/m1_app_integration_test.dart --flavor development --dart-define-from-file=config/development.json --reporter expanded
            flutter test integration_test/m1_pairing_flow_test.dart --flavor development --dart-define-from-file=config/development.json --reporter expanded
            flutter test integration_test/m2_app_integration_test.dart --flavor development --dart-define-from-file=config/development.json --reporter expanded
            flutter test integration_test/m3a_staff_flow_test.dart --flavor development --dart-define-from-file=config/development.json --reporter expanded
            flutter test integration_test/m3c_production_v1_test.dart --flavor development --dart-define-from-file=config/development.json --reporter expanded

  android-builds:
    name: Android / M3C development, staging, production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Development debug APK
        run: flutter build apk -t lib/main_development.dart --flavor development --debug --dart-define-from-file=config/development.json
      - name: Staging release APK
        run: flutter build apk -t lib/main_staging.dart --flavor staging --release --dart-define-from-file=config/staging.json
      - name: Production release APK
        run: flutter build apk -t lib/main_production.dart --flavor production --release --dart-define-from-file=config/production.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-m3c-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  real-w4-contract:
    name: Approved W4 / M1 and M2 real contract gates
    runs-on: [self-hosted, windows, x64, waflo-w4-approved]
    timeout-minutes: 75
    env:
      WAFLO_RUN_BACKEND_CONTRACT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # This persistent approved runner keeps its own SDK/package caches.
          # Uploading those machine-level caches can consume the entire gate
          # timeout after the real tests have already passed.
          cache: false
      - run: flutter pub get
      - name: Require approved W4 checkout
        shell: pwsh
        run: |
          if (-not $env:WAFLO_W4_BACKEND_ROOT) {
            throw 'WAFLO_W4_BACKEND_ROOT is required on the approved integration runner.'
          }
      - name: Real W4 development contract gate
        shell: pwsh
        run: |
          dart run tool/run_real_w4_contract_gate.dart
          dart run tool/run_real_w4_m2_contract_gate.dart
