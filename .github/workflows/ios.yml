name: Flutter M3C iOS Production-v1

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**']
  workflow_dispatch:

concurrency:
  group: flutter-m3c-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-ios:
    name: macOS / M1-M3C tests and three no-sign builds
    # connectivity_plus 7.3.1 uses Network.framework APIs from the iOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - name: M1-M3C unit tests
        run: flutter test test/unit --reporter expanded
      - name: M1-M3C widget tests
        run: flutter test test/widget --reporter expanded
      - name: Localized camera-purpose strings
        run: |
          grep -F "staff pairing and customer membership QR codes" ios/Runner/en.lproj/InfoPlist.strings
          grep -F "لإقران جهاز الموظف وعضوية العميل" ios/Runner/ar.lproj/InfoPlist.strings
      - name: Development no-sign build
        run: flutter build ios -t lib/main_development.dart --no-codesign --flavor development --debug --dart-define-from-file=config/development.json
      - name: Staging no-sign build
        run: flutter build ios -t lib/main_staging.dart --no-codesign --flavor staging --release --dart-define-from-file=config/staging.json
      - name: Production no-sign build
        run: flutter build ios -t lib/main_production.dart --no-codesign --flavor production --release --dart-define-from-file=config/production.json
