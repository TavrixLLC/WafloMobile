name: Flutter M1 iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-m1-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-no-sign:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test
      - name: Development no-sign build
        run: flutter build ios --no-codesign --flavor development --debug --dart-define-from-file=config/development.json
      - name: Staging no-sign build
        run: flutter build ios --no-codesign --flavor staging --release --dart-define-from-file=config/staging.json
      - name: Production no-sign build
        run: flutter build ios --no-codesign --flavor production --release --dart-define-from-file=config/production.json
