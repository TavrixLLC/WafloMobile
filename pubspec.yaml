name: waflo_staff
description: "Secure merchant staff device application for Waflo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  connectivity_plus: ^7.3.1
  cryptography: ^2.9.0
  device_info_plus: ^13.2.0
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  intl: 0.20.2
  json_annotation: ^4.12.0
  mobile_scanner: ^7.4.0
  package_info_plus: ^10.2.1
  permission_handler: ^12.0.1
  retrofit: ^4.9.2
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  crypto: ^3.0.7
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.8
  swagger_parser: ^1.44.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: WafloSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: WafloArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
